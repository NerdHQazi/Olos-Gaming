openapi: 3.1.0

info:
  title: Olos Gaming Backend API
  version: 1.0.0
  description: |
    Express.js backend for the Olos Gaming platform.

    **What this API handles:**
    - Email/password user registration and login (via Supabase Auth)
    - Server health checks
    - Internal diagnostics (protected)

    **What this API does NOT handle:**
    - Google OAuth / social login — handled client-side via the Supabase JS SDK (`signInWithOAuth`)
    - Password reset — handled client-side via the Supabase JS SDK (`resetPasswordForEmail`)
    - Game logic, matchmaking, move validation — handled by Supabase Edge Functions and RPCs
    - Wallet management — handled by Supabase database functions

  contact:
    name: Olos Gaming Team

servers:
  - url: http://localhost:5001
    description: Local development server (default)

tags:
  - name: Auth
    description: User authentication — email/password signup and login
  - name: User
    description: User profile and account operations
  - name: Match
    description: Match lifecycle, summaries, and outcomes
  - name: Leaderboard
    description: Player rankings, leaderboards, and competitive statistics
  - name: Marketplace
    description: In-game items, promotional drops, and catalog inspection
  - name: Guilds
    description: Guild management, rosters, and membership applications
  - name: Tournaments
    description: Tournament listings, brackets, rules, and entry stake registration (Phase 7)
  - name: Health
    description: Server and dependency health checks
  - name: Internal
    description: Protected internal diagnostics (not for public/frontend use)

paths:

  # ────────────────────────────────────────────────
  # AUTH
  # ────────────────────────────────────────────────

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates a new user account in Supabase Auth.
        Input is validated with Zod before being forwarded to Supabase.
        On success, a Supabase user object is returned (note: email confirmation
        may be required depending on Supabase project settings).

        **Rate limit:** 100 requests per IP per 15 minutes.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              fullName: "Jane Doe"
              username: "janedoe"
              email: "jane@example.com"
              password: "SecurePass123!"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              example:
                success: true
                message: "User registered successfully"
                user:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "jane@example.com"
                  fullName: "Jane Doe"
                  username: "janedoe"
        '400':
          description: Validation failed or user already exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_failed:
                  summary: Zod validation error
                  value:
                    success: false
                    message: "Validation failed"
                    errors:
                      - field: "body.password"
                        message: "Password must contain at least one uppercase letter"
                user_exists:
                  summary: Email already registered
                  value:
                    success: false
                    message: "User already registered"
        '503':
          description: Supabase connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Backend connectivity error: Unable to reach database. Please check if Supabase is active."

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user
      description: |
        Authenticates an existing user with email and password via Supabase Auth.
        Returns a Supabase session (access token + refresh token) on success.
        The returned `access_token` should be used as a Bearer token for
        subsequent requests to Supabase Edge Functions.

        **Rate limit:** 100 requests per IP per 15 minutes.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "jane@example.com"
              password: "SecurePass123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                message: "Login successful"
                session:
                  access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refresh_token: "v1.Mx8fTk..."
                  token_type: "bearer"
                  expires_in: 3600
                  expires_at: 1756396800
                user:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "jane@example.com"
                  aud: "authenticated"
                  created_at: "2026-08-17T12:00:00Z"
        '400':
          description: Input validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                success: false
                message: "Validation failed"
                errors:
                  - field: "body.email"
                    message: "Invalid email address"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Invalid login credentials"
        '503':
          description: Supabase connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Backend connectivity error: Unable to reach database. Please check if Supabase is active."

  # ────────────────────────────────────────────────
  # USER
  # ────────────────────────────────────────────────

  /api/user/profile:
    get:
      tags: [User]
      summary: Get current user profile and stats
      description: |
        Retrieves the authenticated user's profile details, in-game GVT wallet balance,
        and derived match statistics. Requires a valid Supabase access token.
      operationId: getUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile and statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                success: true
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  username: "janedoe"
                  fullName: "Jane Doe"
                  email: "jane@example.com"
                  avatarUrl: "https://example.com/avatar.png"
                  walletAddress: "0x1234567890abcdef1234567890abcdef12345678"
                  balanceGvt: 1000.0
                  lockedBalanceGvt: 0.0
                  stats:
                    totalMatches: 12
                    wins: 8
                    losses: 4
                    draws: 0
                    winRate: 66.7
                    currentStreak: 2
                    bestStreak: 4
        '401':
          description: Missing, invalid, or expired authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: No Bearer token provided
                  value:
                    success: false
                    message: "Authorization token required"
                invalid_token:
                  summary: Token expired or invalid
                  value:
                    success: false
                    message: "Invalid or expired token"
        '404':
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "User profile not found"
        '500':
          description: Internal server or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve user profile"

  /api/user/inventory:
    get:
      tags: [User]
      summary: Get authenticated player inventory
      description: |
        Retrieves all items and game assets owned by the authenticated player from user_inventory,
        enriched with marketplace item details and asset metadata. Requires a valid Supabase access token.
      operationId: getUserInventory
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Player inventory retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInventoryResponse'
              example:
                success: true
                data:
                  - inventoryId: "i1a2b3c4-d5e6-7890-abcd-ef1234567890"
                    itemId: "b1c2d3e4-f5a6-7890-abcd-ef1234567890"
                    quantity: 1
                    acquiredAt: "2026-08-15T10:00:00Z"
                    name: "Cybernetic Katana"
                    badge: "RARE"
                    category: "weapons"
                    collection: "Genesis"
                    priceGvt: 250.0
                    priceUsd: 25.0
                    imageUrl: "/cyberKatana.png"
                    assetMetadata:
                      has3dPreview: true
                      previewNote: "Drag to rotate 360°"
                      attributes:
                        - trait: "Attack Speed"
                          value: "+10%"
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Unauthorized: User authentication required"
        '500':
          description: Server or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve user inventory"

  /api/user/matches/recent:
    get:
      tags: [User]
      summary: Get user's recent match history
      description: |
        Returns paginated list of recent matches played by the authenticated user,
        including opponent information, scores, outcome, rewards breakdown, and completion timestamps.

        **Authentication:** Bearer token required.
      operationId: getRecentMatches
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of matches per page (max 50, default 5)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
          example: 5
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: status
          in: query
          required: false
          description: Filter matches by status (all, finished [finished, forfeited], active [active, waiting, reconnecting])
          schema:
            type: string
            enum: [all, finished, active]
            default: all
          example: "finished"
      responses:
        '200':
          description: Recent matches retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentMatchesResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Invalid query parameters"
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Unauthorized: User authentication required"
        '500':
          description: Server error retrieving recent matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve recent matches"

  # ────────────────────────────────────────────────
  # MATCH
  # ────────────────────────────────────────────────

  /api/matches/{matchId}/summary:
    get:
      tags: [Match]
      summary: Get authoritative match summary and outcome
      description: |
        Retrieves the authoritative match summary, participants, scores, outcome,
        and settled reward breakdown. Access is restricted to match participants.
      operationId: getMatchSummary
      security:
        - BearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          description: Unique match UUID
          schema:
            type: string
            format: uuid
          example: "e2b3c4d5-e6f7-8901-abcd-ef1234567890"
      responses:
        '200':
          description: Match summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSummaryResponse'
              example:
                success: true
                data:
                  matchId: "e2b3c4d5-e6f7-8901-abcd-ef1234567890"
                  gameType: "chess"
                  status: "finished"
                  winnerId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  isWinner: true
                  isDraw: false
                  stakeAmount: 25.0
                  rewards:
                    stakeReturned: 25.0
                    winnings: 20.0
                    fee: 5.0
                    currency: "GVT"
                  opponent:
                    id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    username: "GrandmasterX"
                    fullName: "Alexander X"
                    avatarUrl: "https://example.com/avatar2.png"
                  scores:
                    userScore: 1
                    opponentScore: 0
                  stats:
                    totalMoves: 34
                    resolvedReason: "chess_checkmate"
                  resolvedAt: "2026-08-14T22:56:00Z"
                  createdAt: "2026-08-14T22:50:00Z"
        '400':
          description: Invalid match ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Invalid match ID format"
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Authorization token required"
        '403':
          description: Caller is not a participant in this match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Forbidden: You are not a participant in this match"
        '404':
          description: Match not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Match not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve match"

  # ────────────────────────────────────────────────
  # LEADERBOARD
  # ────────────────────────────────────────────────

  /api/leaderboard/players:
    get:
      tags: [Leaderboard]
      summary: Get player rankings and leaderboard
      description: |
        Returns public player rankings aggregated from authoritative match history.
        Rankings are sorted by total wins or total GVT earned, with deterministic tie-breaking.
        Includes pagination and filtering by game type and timeframe.

        **Rate limit:** 100 requests per IP per 15 minutes.
      operationId: getPlayerLeaderboard
      parameters:
        - name: game
          in: query
          required: false
          description: Filter matches by game type
          schema:
            type: string
            enum: [all, chess, checkers, snake]
            default: all
          example: "all"
        - name: timeframe
          in: query
          required: false
          description: Timeframe window for rankings
          schema:
            type: string
            enum: [all-time, monthly, weekly, daily]
            default: all-time
          example: "all-time"
        - name: sortBy
          in: query
          required: false
          description: Metric to rank players by
          schema:
            type: string
            enum: [wins, earnings]
            default: wins
          example: "wins"
        - name: limit
          in: query
          required: false
          description: Number of players per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      responses:
        '200':
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerLeaderboardResponse'
              example:
                success: true
                data:
                  - rank: 1
                    userId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    username: "CryptoKing"
                    fullName: "King Crypto"
                    avatarUrl: "https://example.com/avatar.png"
                    wins: 156
                    losses: 12
                    draws: 0
                    totalMatches: 168
                    winRate: 92.9
                    earned: 10200.0
                    earnedGvt: 10200.0
                    streak: 12
                pagination:
                  page: 1
                  limit: 50
                  total: 1
                  totalPages: 1
                filters:
                  game: "all"
                  timeframe: "all-time"
                  sortBy: "wins"
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: "Validation failed"
                errors:
                  - field: "game"
                    message: "Invalid enum value. Expected 'all' | 'chess' | 'checkers' | 'snake'"
        '500':
          description: Server error retrieving leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve leaderboard data"

  /api/leaderboard/guilds:
    get:
      tags: [Leaderboard, Guilds]
      summary: Get guild rankings and leaderboard
      description: |
        Returns global rankings of competitive guilds sorted by total wins and win rates.
        Supports pagination, timeframe filtering, and optional user membership recognition.

        **Rate limit:** 100 requests per IP per 15 minutes.
      operationId: getGuildLeaderboard
      parameters:
        - name: timeframe
          in: query
          required: false
          description: Timeframe window for rankings
          schema:
            type: string
            enum: [all-time, monthly, weekly]
            default: all-time
          example: "all-time"
        - name: limit
          in: query
          required: false
          description: Number of guilds per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      responses:
        '200':
          description: Guild leaderboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildLeaderboardResponse'
              example:
                success: true
                data:
                  - rank: 1
                    guildId: "00000000-0000-0000-0000-000000000001"
                    name: "Cyber Serpents"
                    shortName: "CS"
                    iconUrl: "/guilds/cyberSerpentImage.png"
                    tags: ["Competitive", "Snake", "Chess"]
                    winRate: 72.4
                    members: 24
                    maxMembers: 30
                    totalWins: 142
                    totalEarned: 98000.0
                    totalStaked: 45000.0
                    currency: "GVT"
                    isUserGuild: false
                pagination:
                  page: 1
                  limit: 50
                  total: 1
                  totalPages: 1
                filters:
                  timeframe: "all-time"
        '500':
          description: Server error retrieving guild leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve guild leaderboard"

  # ────────────────────────────────────────────────
  # MARKETPLACE
  # ────────────────────────────────────────────────

  /api/marketplace/items:
    get:
      tags: [Marketplace]
      summary: Get marketplace catalog and active promotions
      description: |
        Public catalog endpoint exposing in-game items, promotional drops,
        category navigation, and sales metadata.
        Items can be filtered by category, searched by text, and sorted by price or date.

        **Rate limit:** 100 requests per IP per 15 minutes.
      operationId: getMarketplaceCatalog
      parameters:
        - name: category
          in: query
          required: false
          description: Category filter (default all)
          schema:
            type: string
            enum: [all, skins, power-ups, boosts, bundles, limited-edition]
            default: all
          example: "all"
        - name: search
          in: query
          required: false
          description: Search text matching item name or description
          schema:
            type: string
          example: "Cobra"
        - name: sort
          in: query
          required: false
          description: Sorting criteria
          schema:
            type: string
            enum: [newest, price-asc, price-desc, name]
            default: newest
          example: "newest"
        - name: limit
          in: query
          required: false
          description: Number of items per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      responses:
        '200':
          description: Marketplace catalog retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceCatalogResponse'
              example:
                success: true
                data:
                  promo:
                    id: "promo-genesis-viper-elite"
                    badge: "LEGENDARY"
                    title: "Genesis Viper Elite Pack"
                    name: "Neon Viper Skin"
                    collection: "Genesis"
                    description: "Unlock premium neon visual upgrades and 3 powerful consumable boosts in one limited edition Web3 drop bundle."
                    imageUrl: "/snakeNft.png"
                    endsAt: "2026-10-15T12:00:00Z"
                    priceGvt: 120.0
                    priceUsd: 12.0
                    ctaLabel: "Grab the Pack"
                    bundleItemIds: ["item-001", "item-002", "item-003"]
                    createdBy: "CyberStrike Studios"
                  categories:
                    - id: "all"
                      label: "All"
                    - id: "skins"
                      label: "Skins"
                    - id: "power-ups"
                      label: "Power-Ups"
                    - id: "boosts"
                      label: "Boosts"
                    - id: "bundles"
                      label: "Bundles"
                    - id: "limited-edition"
                      label: "Limited Edition"
                  items:
                    - id: "b1c2d3e4-f5a6-7890-abcd-ef1234567890"
                      name: "Neon Cobra Fang Skin"
                      badge: "LEGENDARY"
                      collection: "Genesis"
                      category: "skins"
                      priceGvt: 450.0
                      priceUsd: 45.0
                      imageUrl: "/neonCobraFang.png"
                      createdBy: "CyberStrike Studios"
                      isLimitedEdition: false
                  trending: []
                  recentlySold: []
                pagination:
                  page: 1
                  limit: 50
                  total: 1
                  totalPages: 1
                filters:
                  category: "all"
                  search: null
                  sort: "newest"
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: "Validation failed"
                errors:
                  - field: "category"
                    message: "Invalid enum value"
        '500':
          description: Server error retrieving catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve marketplace catalog"

  /api/marketplace/items/{id}:
    get:
      tags: [Marketplace]
      summary: Inspect marketplace item details
      description: |
        Public endpoint returning complete item details, creator info, supply,
        3D asset preview metadata, and related recommendations.

        **Rate limit:** 100 requests per IP per 15 minutes.
      operationId: getMarketplaceItemById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique item or promo identifier
          schema:
            type: string
          example: "b1c2d3e4-f5a6-7890-abcd-ef1234567890"
      responses:
        '200':
          description: Item details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceItemDetailResponse'
              example:
                success: true
                data:
                  id: "b1c2d3e4-f5a6-7890-abcd-ef1234567890"
                  name: "Neon Cobra Fang Skin"
                  description: "Custom neon skin with luminous trail shaders."
                  badge: "LEGENDARY"
                  category: "skins"
                  collection: "Genesis"
                  priceGvt: 450.0
                  priceUsd: 45.0
                  imageUrl: "/neonCobraFang.png"
                  createdBy: "CyberStrike Studios"
                  isLimitedEdition: false
                  supply: 500
                  assetMetadata:
                    has3dPreview: true
                    previewNote: "Drag to rotate 360° · Animated cyber spine emissive shaders"
                    attributes:
                      - trait: "Speed Boost"
                        value: "+15%"
                      - trait: "Visibility"
                        value: "-10%"
                      - trait: "Emissive Glow"
                        value: "Neon Cyan"
                  relatedItems:
                    - id: "c2d3e4f5-a6b7-8901-bcde-f12345678901"
                      name: "Gold Snake Crown"
                      badge: "LEGENDARY"
                      category: "skins"
                      collection: "Genesis"
                      priceGvt: 750.0
                      priceUsd: 75.0
                      imageUrl: "/goldSnakeCrown.png"
                  createdAt: "2026-08-14T20:00:00Z"
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Item not found"
        '500':
          description: Server error retrieving item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Failed to retrieve marketplace item"

  /api/marketplace/purchase:
    post:
      tags: [Marketplace]
      summary: Purchase marketplace item
      description: |
        Executes an atomic purchase of a marketplace item. Validates item availability,
        decrements item supply if limited, checks and debits the user's off-chain GVT wallet balance,
        records a transaction in marketplace_transactions, and credits the item to user_inventory.
        Requires a valid Supabase access token.
      operationId: purchaseMarketplaceItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseItemRequest'
            example:
              itemId: "b1c2d3e4-f5a6-7890-abcd-ef1234567890"
              quantity: 1
              currency: "GVT"
      responses:
        '200':
          description: Purchase successful and inventory credited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseItemResponse'
              example:
                success: true
                transactionId: "tx-f1e2d3c4-b5a6-7890-abcd-ef1234567890"
                purchasedItem:
                  id: "b1c2d3e4-f5a6-7890-abcd-ef1234567890"
                  name: "Cybernetic Katana"
                  badge: "RARE"
                  category: "weapons"
                  priceGvt: 250.0
                  imageUrl: "/cyberKatana.png"
                deductedAmount: 250.0
                remainingBalance: 750.0
        '400':
          description: Validation error or insufficient GVT balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficient_balance:
                  summary: Insufficient GVT balance
                  value:
                    success: false
                    message: "Insufficient GVT balance"
                validation_error:
                  summary: Invalid request payload
                  value:
                    success: false
                    message: "Validation failed"
                    errors:
                      - field: "quantity"
                        message: "Quantity must be at least 1"
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Unauthorized: User authentication required"
        '404':
          description: Item not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Item not found"
        '409':
          description: Item is out of stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Item is out of stock"
        '500':
          description: Internal server error or transaction failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Internal server error while processing purchase"

  # ────────────────────────────────────────────────
  # GUILDS
  # ────────────────────────────────────────────────

  /api/guilds:
    get:
      tags: [Guilds]
      summary: Search and list guilds
      description: |
        Returns paginated list of guilds with search by name/tags, sorting by rank, wins,
        members, or recency, and extracts the featured guild banner.

        **Rate limit:** 100 requests per IP per 15 minutes.
      operationId: listGuilds
      parameters:
        - name: search
          in: query
          required: false
          description: Search term for guild name, tag, or description
          schema:
            type: string
          example: "Cyber"
        - name: tag
          in: query
          required: false
          description: Filter guilds by tag keyword
          schema:
            type: string
          example: "Competitive"
        - name: sort
          in: query
          required: false
          description: Sorting criterion
          schema:
            type: string
            enum: [rank, wins, members, newest]
            default: rank
          example: "rank"
        - name: limit
          in: query
          required: false
          description: Number of guilds per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      responses:
        '200':
          description: Guild list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Server error retrieving guilds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Guilds]
      summary: Create a new guild
      description: |
        Establishes a new guild contract on the platform. Atomically debits a 5.00 GVT contract
        creation fee from the creator's wallet, inserts the guild record, and registers the caller
        as the Guild Leader.

        **Authentication:** Bearer token required.
      operationId: createGuild
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuildRequest'
            example:
              name: "Iron Valkyries"
              tag: "VALK"
              description: "Elite tactical arena squad."
              maxMembers: 30
              minRank: "Silver Bracket (Tier II)"
              entryFee: 100
              isPrivate: true
              tags: ["Competitive", "Chess"]
      responses:
        '201':
          description: Guild created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGuildResponse'
        '400':
          description: Validation error or insufficient GVT balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Insufficient GVT balance for guild contract creation (5 GVT required)"
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - guild name or tag already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "A guild with this name already exists"
        '500':
          description: Server error creating guild
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/guilds/{id}:
    get:
      tags: [Guilds]
      summary: Get full guild profile and member roster
      description: |
        Retrieves detailed guild metadata, member roster with roles and profiles,
        and structured operational sections (wars, treasury, announcements).
      operationId: getGuildById
      parameters:
        - name: id
          in: path
          required: true
          description: Guild UUID
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Guild details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildProfileResponse'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Guild not found"
        '500':
          description: Server error fetching guild
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/guilds/{id}/apply:
    post:
      tags: [Guilds]
      summary: Submit guild membership application
      description: |
        Submits a membership join request for review by guild leaders and officers.
        Enforces user is not already a member, has no pending application, and guild is not at capacity.

        **Authentication:** Bearer token required.
      operationId: applyToGuild
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Guild UUID
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyGuildRequest'
            example:
              motivation: "Experienced chess strategist with a 75% win rate in 1v1 arenas."
              guildHistory: "Formerly with ViperSlayers"
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyGuildResponse'
        '400':
          description: Bad request (already member or capacity reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "You are already a member of this guild"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (pending application exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "You already have a pending application to this guild"
        '500':
          description: Server error submitting application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────────
  # TOURNAMENTS
  # ────────────────────────────────────────────────

  /api/tournaments:
    get:
      tags: [Tournaments]
      summary: List tournaments
      description: |
        Returns paginated list of tournaments. Supports filtering by status and game type,
        as well as sorting by upcoming date, prize pool, participant count, and newest.
      operationId: listTournaments
      parameters:
        - name: search
          in: query
          required: false
          description: Search tournament titles
          schema:
            type: string
          example: "Championship"
        - name: gameType
          in: query
          required: false
          description: Filter by game type (e.g. chess, checkers)
          schema:
            type: string
          example: "chess"
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
            enum: [upcoming, registration_open, active, completed, cancelled]
          example: "registration_open"
        - name: sort
          in: query
          required: false
          description: Sort ordering
          schema:
            type: string
            enum: [upcoming, prize, participants, newest]
            default: upcoming
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Tournaments list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tournaments/{id}:
    get:
      tags: [Tournaments]
      summary: Get tournament details
      description: |
        Retrieves tournament information including round status, rules, prize distribution,
        structured bracket tree, and caller registration status (if authenticated).
      operationId: getTournamentDetails
      parameters:
        - name: id
          in: path
          required: true
          description: Tournament UUID
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Tournament details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetailsResponse'
        '400':
          description: Invalid tournament ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tournament not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tournaments/{id}/register:
    post:
      tags: [Tournaments]
      summary: Register for tournament
      description: |
        Registers the authenticated user for the tournament and atomically debits the entry fee
        from their GVT balance (if entry fee > 0). Enforces capacity, registration window, and unique entry.

        **Authentication:** Bearer token required.
      operationId: registerTournament
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tournament UUID
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Successfully registered for tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentRegistrationResponse'
        '400':
          description: Bad request (insufficient balance, registration closed, or capacity reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tournament not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (user already registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error during registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────────
  # HEALTH
  # ────────────────────────────────────────────────

  /api/health:
    get:
      tags: [Health]
      summary: Server health check
      description: |
        Public endpoint confirming the Express server is running.
        Returns the process uptime in seconds.
        Use for uptime monitoring and deployment readiness checks.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "ok"
                uptime: 3742.51

  # ────────────────────────────────────────────────
  # INTERNAL (Protected)
  # ────────────────────────────────────────────────

  /api/_internal/supabase-health:
    get:
      tags: [Internal]
      summary: Supabase connectivity check (protected)
      description: |
        Performs a live read query against the `profiles` table to verify
        Supabase connectivity. Requires the `x-internal-token` header matching
        the server's `INTERNAL_DEBUG_TOKEN` environment variable.

        **This endpoint is for internal debugging only — do not call from
        production frontend code.**

        **Rate limit:** 100 requests per IP per 15 minutes (shared with all `/api/*`).
      operationId: supabaseHealthCheck
      security:
        - InternalToken: []
      responses:
        '200':
          description: Supabase is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupabaseHealthResponse'
              example:
                success: true
                message: "Supabase reachable"
                sampleRows: 1
        '403':
          description: Missing or invalid internal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Forbidden"
        '500':
          description: Server-side token not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Internal debug token not configured on server"
        '502':
          description: Supabase query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Supabase call failed"

# ────────────────────────────────────────────────
# COMPONENTS
# ────────────────────────────────────────────────

components:

  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: x-internal-token
      description: >
        Secret token for internal diagnostic endpoints. Must match the
        `INTERNAL_DEBUG_TOKEN` environment variable on the server.

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase Auth JWT access token passed in the `Authorization: Bearer <token>` header.

  schemas:

    # ── Request bodies ──────────────────────────

    SignupRequest:
      type: object
      required: [fullName, username, email, password]
      properties:
        fullName:
          type: string
          minLength: 2
          description: User's full display name
          example: "Jane Doe"
        username:
          type: string
          minLength: 3
          description: Unique username for the platform
          example: "janedoe"
        email:
          type: string
          format: email
          description: Valid email address
          example: "jane@example.com"
        password:
          type: string
          minLength: 8
          description: |
            Password must contain:
            - At least 8 characters
            - At least one uppercase letter (A–Z)
            - At least one lowercase letter (a–z)
            - At least one digit (0–9)
            - At least one special character (e.g. `!@#$%^&*`)
          example: "SecurePass123!"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "jane@example.com"
        password:
          type: string
          minLength: 1
          example: "SecurePass123!"

    # ── Response bodies ─────────────────────────

    SignupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "User registered successfully"
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Supabase auth user UUID
            email:
              type: string
              format: email
            fullName:
              type: string
            username:
              type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login successful"
        session:
          $ref: '#/components/schemas/SupabaseSession'
        user:
          $ref: '#/components/schemas/SupabaseUser'

    SupabaseSession:
      type: object
      description: Supabase Auth session object
      properties:
        access_token:
          type: string
          description: JWT access token — use as Bearer token for Supabase Edge Function requests
        refresh_token:
          type: string
          description: Opaque refresh token for obtaining a new access token
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          description: Seconds until the access token expires (typically 3600)
          example: 3600
        expires_at:
          type: integer
          description: Unix timestamp at which the access token expires
          example: 1756396800

    SupabaseUser:
      type: object
      description: Supabase Auth user object (subset of fields)
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        aud:
          type: string
          example: "authenticated"
        created_at:
          type: string
          format: date-time

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        uptime:
          type: number
          description: Server process uptime in seconds
          example: 3742.51

    SupabaseHealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Supabase reachable"
        sampleRows:
          type: integer
          description: Number of rows returned from the health probe query (0 or 1)
          example: 1

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "An error occurred"

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Dot-separated path to the failing field (e.g. `body.password`)
                example: "body.password"
              message:
                type: string
                description: Human-readable validation error
                example: "Password must contain at least one uppercase letter"

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfileData'

    UserProfileData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
          example: "janedoe"
        fullName:
          type: string
          nullable: true
          example: "Jane Doe"
        email:
          type: string
          format: email
          nullable: true
          example: "jane@example.com"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar.png"
        walletAddress:
          type: string
          nullable: true
          example: "0x1234567890abcdef1234567890abcdef12345678"
        balanceGvt:
          type: number
          description: Available in-game off-chain GVT balance
          example: 1000.0
        lockedBalanceGvt:
          type: number
          description: Off-chain GVT balance locked in active stakes
          example: 0.0
        stats:
          $ref: '#/components/schemas/UserMatchStats'

    UserMatchStats:
      type: object
      properties:
        totalMatches:
          type: integer
          description: Total completed/forfeited matches
          example: 12
        wins:
          type: integer
          example: 8
        losses:
          type: integer
          example: 4
        draws:
          type: integer
          example: 0
        winRate:
          type: number
          description: Win percentage of completed matches
          example: 66.7
        currentStreak:
          type: integer
          description: Current consecutive wins
          example: 2
        bestStreak:
          type: integer
          description: Highest consecutive wins achieved
          example: 4

    MatchSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/MatchSummaryData'

    MatchSummaryData:
      type: object
      properties:
        matchId:
          type: string
          format: uuid
        gameType:
          type: string
          example: "chess"
        status:
          type: string
          example: "finished"
        winnerId:
          type: string
          format: uuid
          nullable: true
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        isWinner:
          type: boolean
          example: true
        isDraw:
          type: boolean
          example: false
        stakeAmount:
          type: number
          example: 25.0
        rewards:
          $ref: '#/components/schemas/MatchRewards'
          nullable: true
        opponent:
          $ref: '#/components/schemas/MatchOpponent'
        scores:
          $ref: '#/components/schemas/MatchScores'
        stats:
          $ref: '#/components/schemas/MatchPerformanceStats'
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-14T22:56:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-08-14T22:50:00Z"

    MatchRewards:
      type: object
      properties:
        stakeReturned:
          type: number
          example: 25.0
        winnings:
          type: number
          example: 20.0
        fee:
          type: number
          example: 5.0
        currency:
          type: string
          example: "GVT"

    MatchOpponent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        username:
          type: string
          nullable: true
          example: "GrandmasterX"
        fullName:
          type: string
          nullable: true
          example: "Alexander X"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar2.png"

    MatchScores:
      type: object
      properties:
        userScore:
          type: integer
          example: 1
        opponentScore:
          type: integer
          example: 0

    MatchPerformanceStats:
      type: object
      properties:
        totalMoves:
          type: integer
          example: 34
        resolvedReason:
          type: string
          nullable: true
          example: "chess_checkmate"

    PlayerLeaderboardResponse:
      type: object
      required:
        - success
        - data
        - pagination
        - filters
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlayerLeaderboardEntry'
        pagination:
          $ref: '#/components/schemas/LeaderboardPagination'
        filters:
          $ref: '#/components/schemas/LeaderboardFilters'

    PlayerLeaderboardEntry:
      type: object
      required:
        - rank
        - userId
        - username
        - wins
        - losses
        - draws
        - totalMatches
        - winRate
        - earned
