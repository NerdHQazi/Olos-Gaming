import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#04070f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "build_src"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/build_src
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("build_src.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("build_src.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <style>
        :root {
            --bg: #04070f;
            --cyan: #00d2ff;
            --amber: #ffb800;
            --purple: #7c3aed;
            --rose: #f43f5e;
            --muted: #8b93a7;
        }

        /* ---- Page: never scroll, never select, never zoom on touch -------- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            overscroll-behavior: none;
            background: var(--bg) !important;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ---- Canvas: always exactly 1:2, centred, fitted to the window ----
           !important beats the inline sizes pygbag's resize code writes.     */
        #canvas {
            position: absolute !important;
            inset: 0 !important;
            margin: auto !important;
            width: min(100vw, 50vh) !important;
            height: min(100vh, 200vw) !important;
            display: block;
            border: 0;
            outline: none;
            background: transparent;
            touch-action: none;
            z-index: 5;
        }

        /* ---- Pygbag internals we do not want on screen -------------------- */
        body:not(.debug) #crt,
        body:not(.debug) #pyconsole,
        body:not(.debug) #system,
        body:not(.debug) #dlg,
        body:not(.debug) #html {
            display: none !important;
        }
        #status { display: none; }

        /* ---- Embedded in the Next page: the page draws the startup screen --
           (the class is added by the script at the bottom of this file)       */
        body.embedded #splash,
        body.embedded #infobox,
        body.embedded #transfer { display: none !important; }

        /* ---- Splash: matches the in-game 10 x 20 grid ---------------------- */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 999990;
            pointer-events: none; /* taps must still reach the page to unlock audio */
            background:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 100% 5%,
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 10% 100%,
                radial-gradient(ellipse at 50% 42%, rgba(0,210,255,.10), transparent 60%),
                var(--bg);
            transition: opacity .45s ease, visibility 0s linear .45s;
        }
        body.started #splash { opacity: 0; visibility: hidden; }

        /* T-piece loader: four cells that light up in sequence */
        .loader {
            position: absolute;
            left: 50%;
            top: 38%;
            width: 74px;
            height: 48px;
            margin-left: -37px;
            display: grid;
            grid-template-columns: repeat(3, 22px);
            grid-template-rows: repeat(2, 22px);
            gap: 4px;
        }
        .loader i {
            border-radius: 5px;
            animation: cell 1.4s ease-in-out infinite;
        }
        .loader i:nth-child(1) { background: var(--cyan);   grid-area: 1 / 1; }
        .loader i:nth-child(2) { background: var(--amber);  grid-area: 1 / 2; animation-delay: .15s; }
        .loader i:nth-child(3) { background: var(--purple); grid-area: 1 / 3; animation-delay: .30s; }
        .loader i:nth-child(4) { background: var(--rose);   grid-area: 2 / 2; animation-delay: .45s; }
        @keyframes cell {
            0%, 100% { opacity: .25; transform: scale(.72); }
            35%      { opacity: 1;   transform: scale(1); }
        }
        /* Once the game is ready to start, the piece stays fully lit */
        body.ready .loader i { animation: none; opacity: 1; transform: none; }

        /* ---- Download progress -------------------------------------------- */
        #transfer {
            position: fixed;
            left: 50%;
            top: 56%;
            transform: translateX(-50%);
            width: min(60%, 220px);
            z-index: 999998;
            pointer-events: none;
        }
        #progress {
            display: block;
            width: 100%;
            height: 4px;
            border: 0;
            border-radius: 99px;
            overflow: hidden;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,.10);
        }
        #progress::-webkit-progress-bar   { background: transparent; }
        #progress::-webkit-progress-value { background: var(--cyan); border-radius: 99px; }
        #progress::-moz-progress-bar      { background: var(--cyan); border-radius: 99px; }

        /* ---- Status line / start prompt (pygbag writes its text here) -------
           The original text is hidden and replaced, so copy lives in CSS.     */
        #infobox {
            position: fixed;
            left: 50% !important;
            top: 58% !important;
            transform: translateX(-50%);
            z-index: 999999;
            padding: 0;
            background: none;
            color: var(--muted);
            font-size: 0;
            white-space: nowrap;
            pointer-events: none;
        }
        #transfer:not([hidden]) ~ #infobox { visibility: hidden; } /* progress bar shows instead */
        #infobox::after {
            content: "Loading game\2026";
            font-size: 14px;
            font-weight: 500;
            letter-spacing: .02em;
        }
        #infobox[data-state="ready"]::after {
            content: "Tap to start";

            font-size: 16px;

            animation: ready 1.8s ease-in-out infinite;
        }
        @keyframes ready {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,210,255,0),   0 0 14px rgba(0,210,255,.25); }
            50%      { box-shadow: 0 0 0 6px rgba(0,210,255,.08), 0 0 26px rgba(0,210,255,.45); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader i { animation: none; opacity: 1; transform: none; }
            #infobox[data-state="ready"]::after { animation: none; }

        document.body.classList.add("debug")

    function info_inline(data){
        document.getElementById("info").innerHTML = data
    }

    function info_online(url) {
        // display info about current APK
        fetch( url /*, options */)
            .then((response) => response.text())
            .then((html) => {
                info_inline(html);
        })
        .catch((error) => {
            console.warn(error);
        });
    }

    function frame_online(url) {
        window.frames["iframe"].location = url;
    }

    // Startup screen, driven by pygbag's own status box:
    //   text mentions click/touch -> "Tap to start" prompt
    //   box hidden by python      -> the game is running, fade the splash out
    // When this page is embedded in the Next page, it also tells the parent which
    // step it is in, so the page can draw the same startup screen over the board.
    (function () {
        const box = document.getElementById("infobox");
        const embedded = window.parent !== window;
        if (embedded) document.body.classList.add("embedded");

        let lastStatus = "";
        const report = (status) => {
            if (!embedded || status === lastStatus) return;
            lastStatus = status;
            try {
                window.parent.postMessage(
                    JSON.stringify({ source: "olos-tetris", type: "status", status: status }),
                    "*"
                );
            } catch (e) {}
        };

        const sync = () => {
            const started = box.style.display === "none";
            const ready = !started && /click|touch/i.test(box.textContent || "");
            box.dataset.state = ready ? "ready" : "loading";
            document.body.classList.toggle("ready", ready);
            if (started) document.body.classList.add("started");
            else report(ready ? "ready" : "loading");
        };

        new MutationObserver(sync).observe(box, {
            childList: true,
            characterData: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["style"],
        });
        sync();
    })();

    </script>
